<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CTF — Submit your solve / patch</title>
  <style>
    :root { --bg:#f4f6f8; --panel:#fff; --ink:#1f2933; --muted:#6b7280; --line:#e5e7eb;
      --brand:#0f766e; --brand-ink:#fff; }
    @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
      --bg:#0f1419; --panel:#1a2029; --ink:#e6edf3; --muted:#9aa5b1; --line:#2a323d;
      --brand:#14b8a6; --brand-ink:#06241f; } }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);
      font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    main{max-width:720px;margin:32px auto;padding:0 16px}
    h1{font-size:1.2rem} p.sub{color:var(--muted)}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
    label{display:block;font-size:.82rem;color:var(--muted);margin:12px 0 4px}
    input,select,textarea{width:100%;padding:10px 12px;font:inherit;color:var(--ink);
      background:var(--bg);border:1px solid var(--line);border-radius:8px}
    textarea{resize:vertical} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    button{margin-top:16px;padding:10px 18px;font-weight:600;border:0;border-radius:8px;
      background:var(--brand);color:var(--brand-ink);cursor:pointer}
    .msg{margin-top:12px} .ok{color:#0a7d55} .err{color:#b91c1c}
    .hint{color:var(--muted);font-size:.85rem}
  </style>
</head>
<body>
<main>
  <h1>Submit your solve / patch</h1>
  <p class="sub">Explain how you solved a challenge. For the <strong>patch flag</strong>
     (+50%), also paste your fix as a diff — a reviewer grades it against the rubric.</p>
  <div class="card">
    <label>Challenge</label>
    <select id="challenge"></select>

    <label>Your name / player id</label>
    <input id="player" placeholder="e.g. user1">

    <label>How did you solve it? (required)</label>
    <textarea id="explanation" rows="5" placeholder="In your own words — the bug, and how you exploited it."></textarea>

    <label>Your fix, as a diff (optional — required for the patch flag)</label>
    <textarea id="diff" class="mono" rows="10" placeholder="git diff > my-fix.patch, then paste it here"></textarea>
    <p class="hint">Explanation only = solve check. Explanation + diff = patch-flag review.</p>

    <button onclick="submit()">Submit</button>
    <div class="msg" id="msg"></div>
  </div>
</main>
<script>
  const $ = id => document.getElementById(id);
  fetch('/api/challenges').then(r=>r.json()).then(cs=>{
    $('challenge').innerHTML = cs.map(c=>`<option>${c}</option>`).join('');
  });
  async function submit(){
    const body = { challenge:$('challenge').value, player:$('player').value,
      explanation:$('explanation').value, diff:$('diff').value };
    const m = $('msg'); m.textContent='Submitting…'; m.className='msg';
    try{
      const r = await fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const d = await r.json();
      if(!r.ok){ m.textContent = d.error || 'Error'; m.className='msg err'; return; }
      m.textContent = `Submitted (${d.kind} review, id ${d.id}). A reviewer will follow up.`;
      m.className='msg ok'; $('explanation').value=''; $('diff').value='';
    }catch(e){ m.textContent = e.message; m.className='msg err'; }
  }
</script>
</body>
</html>
