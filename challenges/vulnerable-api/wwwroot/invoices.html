<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acme Parts — Billing</title>
  <style>
    :root {
      --bg: #f4f6f8; --panel: #ffffff; --ink: #1f2933; --muted: #6b7280;
      --line: #e5e7eb; --brand: #0f766e; --brand-ink: #ffffff; --accent: #0e7490;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1419; --panel: #1a2029; --ink: #e6edf3; --muted: #9aa5b1;
        --line: #2a323d; --brand: #14b8a6; --brand-ink: #06241f; --accent: #22d3ee;
        --shadow: 0 1px 3px rgba(0,0,0,.4);
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
      font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    header { background: var(--brand); color: var(--brand-ink); padding: 14px 20px;
      display: flex; align-items: center; gap: 12px; }
    header .logo { width: 26px; height: 26px; border-radius: 6px; background: var(--brand-ink);
      color: var(--brand); display: grid; place-items: center; font-weight: 800; }
    header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
    header .who { margin-left: auto; font-size: .8rem; opacity: .9; }
    main { max-width: 760px; margin: 24px auto; padding: 0 20px; display: grid; gap: 18px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      box-shadow: var(--shadow); padding: 20px; }
    h2 { margin: 0 0 12px; font-size: 1.05rem; }
    label { display: block; font-size: .8rem; color: var(--muted); margin: 0 0 4px; }
    input { width: 100%; padding: 10px 12px; font-size: .95rem; color: var(--ink);
      background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
    input:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
    .row { display: flex; gap: 10px; align-items: end; }
    .row > div { flex: 1; }
    button { padding: 10px 18px; font-size: .95rem; font-weight: 600; border: 0;
      border-radius: 8px; background: var(--brand); color: var(--brand-ink); cursor: pointer;
      white-space: nowrap; }
    button:hover { filter: brightness(1.05); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: .9rem; }
    th { color: var(--muted); font-weight: 600; font-size: .72rem; text-transform: uppercase; letter-spacing: .5px; }
    td.amt { text-align: right; font-variant-numeric: tabular-nums; }
    .muted { color: var(--muted); font-size: .85rem; }
    .hidden { display: none; }
    .note { background: rgba(125,125,125,.1); border-radius: 8px; padding: 12px; font-size: .9rem; }
    .err { color: #b91c1c; }
  </style>
</head>
<body>
  <header>
    <span class="logo">A</span>
    <h1>Acme Parts · Billing</h1>
    <span class="who" id="who"></span>
  </header>

  <main>
    <div class="card" id="loginCard">
      <h2>Sign in</h2>
      <div class="row">
        <div><label>Email</label><input id="email" value="user1@corp.local"></div>
        <div><label>Password</label><input id="password" type="password" value="hunter2"></div>
        <button onclick="login()">Sign in</button>
      </div>
      <p class="muted" id="loginMsg" style="margin-top:10px"></p>
    </div>

    <div class="card hidden" id="appCard">
      <h2>My invoices</h2>
      <div id="mine"></div>

      <h2 style="margin-top:22px">Open an invoice</h2>
      <div class="row">
        <div><label>Invoice #</label><input id="invId" type="number" value="1"></div>
        <button onclick="openInvoice()">Open</button>
      </div>
      <div id="viewer" style="margin-top:12px"></div>
    </div>
  </main>

  <script>
    let token = null;
    const $ = id => document.getElementById(id);
    function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    const money = n => n==null ? '' : '$' + Number(n).toFixed(2);

    async function login() {
      $('loginMsg').textContent = 'Signing in…';
      try {
        const r = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ email: $('email').value, password: $('password').value }) });
        if (!r.ok) { $('loginMsg').innerHTML = '<span class="err">Unknown user.</span>'; return; }
        const d = await r.json();
        token = d.token;
        $('who').textContent = 'Signed in as ' + d.displayName;
        $('loginCard').classList.add('hidden');
        $('appCard').classList.remove('hidden');
        loadMine();
      } catch (e) { $('loginMsg').innerHTML = '<span class="err">'+esc(e.message)+'</span>'; }
    }

    async function loadMine() {
      const r = await fetch('/api/invoices', { headers:{ Authorization:'Bearer '+token }});
      const rows = await r.json();
      $('mine').innerHTML = !rows.length ? '<p class="muted">No invoices.</p>' :
        '<table><thead><tr><th>#</th><th>Amount</th><th>Notes</th></tr></thead><tbody>' +
        rows.map(i=>`<tr><td>${i.id}</td><td class="amt">${money(i.amount)}</td><td>${esc(i.notes)}</td></tr>`).join('') +
        '</tbody></table>';
    }

    async function openInvoice() {
      const id = $('invId').value;
      const r = await fetch('/api/invoices/'+encodeURIComponent(id), { headers:{ Authorization:'Bearer '+token }});
      if (r.status === 404) { $('viewer').innerHTML = '<p class="muted">No such invoice.</p>'; return; }
      if (r.status === 403) { $('viewer').innerHTML = '<p class="muted">You don\'t have access to that invoice.</p>'; return; }
      if (!r.ok) { $('viewer').innerHTML = '<p class="err">Error '+r.status+'</p>'; return; }
      const i = await r.json();
      $('viewer').innerHTML = `<div class="note"><strong>Invoice #${i.id}</strong> ·
        owner ${i.ownerId} · ${money(i.amount)}<br>${esc(i.notes)}</div>`;
    }
  </script>
</body>
</html>
