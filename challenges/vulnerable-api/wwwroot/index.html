<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Search</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
    h1 { font-size: 1.4rem; }
    .bar { display: flex; gap: 8px; margin: 16px 0; }
    input { flex: 1; padding: 10px; font-size: 1rem; border: 1px solid #bbb; border-radius: 6px; }
    button { padding: 10px 16px; font-size: 1rem; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; }
    .hint { color: #666; font-size: .9rem; }
    pre { background: #f3f4f6; padding: 8px; border-radius: 6px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Product Search</h1>
  <p class="hint">Search our catalogue. (Marketing swears the API is fine.) You can also hit
    it directly: <code>GET /api/search?q=...</code></p>

  <div class="bar">
    <input id="q" placeholder="Search products, e.g. Widget" autofocus>
    <button onclick="run()">Search</button>
  </div>

  <div id="out"></div>

  <script>
    async function run() {
      const q = document.getElementById('q').value;
      const out = document.getElementById('out');
      try {
        const res = await fetch('/api/search?q=' + encodeURIComponent(q));
        const rows = await res.json();
        if (!Array.isArray(rows) || rows.length === 0) { out.innerHTML = '<p>No results.</p>'; return; }
        out.innerHTML = '<table><tr><th>Id</th><th>Name</th></tr>' +
          rows.map(r => `<tr><td>${r.id}</td><td>${r.name ?? ''}</td></tr>`).join('') +
          '</table>';
      } catch (e) {
        out.innerHTML = '<pre>' + (e && e.message ? e.message : e) + '</pre>';
      }
    }
    document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
  </script>
</body>
</html>
