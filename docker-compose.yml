# Internal CTF — CTFd + vulnerable apps + Guacamole gateway.
# One `docker compose up -d`. Flags come from .env (never baked into images).
#
# Networks:
#   ctf-internal  — challenges + CTFd + the player host can reach this. NO internet.
#   ctf-edge      — only CTFd + Guacamole are exposed here to reach players' browsers.
# Vulnerable containers sit on ctf-internal with `internal: true` so they cannot egress.

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  deploy:
    resources:
      limits:
        cpus: "0.75"
        memory: 512M

services:
  # ---- Platform ----
  ctfd:
    image: ctfd/ctfd:latest
    environment:
      SECRET_KEY: ${CTFD_SECRET_KEY}
      DATABASE_URL: mysql+pymysql://ctfd:${CTFD_DB_PASSWORD}@ctfd-db/ctfd
    volumes:
      - ./ctfd/plugins:/opt/CTFd/CTFd/plugins/custom:ro
    networks: [ctf-internal, ctf-edge]
    depends_on: [ctfd-db]
    restart: unless-stopped

  ctfd-db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: ctfd
      MARIADB_USER: ctfd
      MARIADB_PASSWORD: ${CTFD_DB_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    networks: [ctf-internal]
    restart: unless-stopped

  # ---- Vulnerable apps (challenges 1-9) ----
  vuln-api:
    build: ./challenges/vulnerable-api
    <<: *hardening
    environment:
      ConnectionStrings__Default: ${VULN_DB_CONNECTION}
      FLAG_C1_SQLI: ${FLAG_C1_SQLI}
      FLAG_C2_IDOR: ${FLAG_C2_IDOR}
      FLAG_C4_FROMSQLRAW: ${FLAG_C4_FROMSQLRAW}
      FLAG_C5_MASSASSIGN: ${FLAG_C5_MASSASSIGN}
      FLAG_C7_PATHTRAVERSAL: ${FLAG_C7_PATHTRAVERSAL}
      FLAG_C8_WEAKJWT: ${FLAG_C8_WEAKJWT}
      FLAG_C9_JWTOFF: ${FLAG_C9_JWTOFF}
      FLAG_C10_BLINDSQLI: ${FLAG_C10_BLINDSQLI}
      Jwt__Key: ${JWT_WEAK_KEY}
    tmpfs: ["/tmp"]        # read_only root still needs a writable temp
    networks: [ctf-internal]
    depends_on: [vuln-db]
    restart: unless-stopped

  vuln-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 2G }
    networks: [ctf-internal]
    restart: unless-stopped

  # ---- Vulnerable frontend (challenges 6, 12) ----
  vuln-web:
    build: ./challenges/vulnerable-web
    <<: *hardening
    networks: [ctf-internal]
    restart: unless-stopped

  # ---- Browser gateway to the player host ----
  guacd:
    image: guacamole/guacd:1.5.5
    networks: [ctf-internal]
    restart: unless-stopped

  guacamole:
    image: guacamole/guacamole:1.5.5
    environment:
      GUACD_HOSTNAME: guacd
      MYSQL_HOSTNAME: guac-db
      MYSQL_DATABASE: guacamole
      MYSQL_USER: guacamole
      MYSQL_PASSWORD: ${GUAC_DB_PASSWORD}
      # Clipboard + file transfer are disabled per-connection in the Guac config,
      # see guacamole/README.md. Session recording is enabled there too.
    networks: [ctf-internal, ctf-edge]
    depends_on: [guacd, guac-db]
    restart: unless-stopped

  guac-db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: guacamole
      MARIADB_USER: guacamole
      MARIADB_PASSWORD: ${GUAC_DB_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - ./guacamole/db-data:/var/lib/mysql
    networks: [ctf-internal]
    restart: unless-stopped

networks:
  ctf-internal:
    internal: true      # NO route to the internet for anything on this network
  ctf-edge:
    driver: bridge
