# Internal CTF — Season 1 deployment.
# CTFd + one vulnerable-api instance per challenge (own DB, own flag) + the C6 admin bot +
# a one-shot git-secret seeder + the Guacamole gateway. `docker compose up -d`.
#
# Flags come from .env (never baked into images — BUILD.md §6). Challenges sit on an
# internal-only network with no route to the internet; only CTFd + Guacamole reach the edge.
#
# NOTE: authored without a Docker host to test against. Verify with the checklist in
# docs/operator/DEPLOY.md before a live session.

x-vuln-api: &vuln-api
  build:
    context: ./challenges/vulnerable-api
  image: ctf/vuln-api:latest
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: ["/tmp"]
  deploy:
    resources:
      limits: { cpus: "0.75", memory: 512M }
  networks: [ctf-internal]
  depends_on:
    vuln-db:
      condition: service_healthy
    db-init:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  # ---------- Platform ----------
  ctfd:
    image: ctfd/ctfd:latest
    environment:
      SECRET_KEY: ${CTFD_SECRET_KEY}
      DATABASE_URL: mysql+pymysql://ctfd:${CTFD_DB_PASSWORD}@ctfd-db/ctfd
    volumes:
      - ./ctfd/plugins:/opt/CTFd/CTFd/plugins/custom:ro
      # For the docker-challenge plugin (C11 per-player containers). Mounting the socket gives
      # CTFd control of the Docker host — keep CTFd patched and access-controlled. Omit this
      # (and the plugin) if you use the shared vuln-c11 instance instead.
      - /var/run/docker.sock:/var/run/docker.sock
    ports: ["8000:8000"]      # organizer/player-laptop access to the scoreboard
    networks: [ctf-internal, ctf-edge]
    depends_on: [ctfd-db]
    restart: unless-stopped

  ctfd-db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: ctfd
      MARIADB_USER: ctfd
      MARIADB_PASSWORD: ${CTFD_DB_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes: ["ctfd-db-data:/var/lib/mysql"]
    networks: [ctf-internal]
    restart: unless-stopped

  # ---------- Shared database for the vulnerable APIs ----------
  # One-shot: create per-challenge databases + LEAST-PRIVILEGE logins (blocks cross-DB
  # cheating via SQL injection). Apps wait for this to finish.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    entrypoint: ["/bin/bash", "/init/init.sh"]
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - ./db/init.sh:/init/init.sh:ro
    depends_on:
      vuln-db:
        condition: service_healthy
    networks: [ctf-internal]
    restart: "no"

  vuln-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 2560M }
    healthcheck:
      # Each API waits for this before it seeds. Path is the 2022 image's tools dir.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks: [ctf-internal]
    restart: unless-stopped

  # ---------- One vulnerable-api instance per challenge ----------
  vuln-c1:                                   # Challenge 1 — SQL injection (UI at /)
    <<: *vuln-api
    environment:
      CTF_CHALLENGE: c1
      ConnectionStrings__Default: "Server=vuln-db;Database=Vuln_C1;User Id=c1_app;Password=${DB_APP_PASSWORD};TrustServerCertificate=true"
      FLAG_C1_SQLI: ${FLAG_C1_SQLI}

  vuln-c2:                                   # Challenge 2 — IDOR (UI at /invoices.html)
    <<: *vuln-api
    environment:
      CTF_CHALLENGE: c2
      ConnectionStrings__Default: "Server=vuln-db;Database=Vuln_C2;User Id=c2_app;Password=${DB_APP_PASSWORD};TrustServerCertificate=true"
      FLAG_C2_IDOR: ${FLAG_C2_IDOR}

  vuln-c7:                                   # Challenge 7 — path traversal (UI at /reports.html)
    <<: *vuln-api
    environment:
      CTF_CHALLENGE: c7
      ConnectionStrings__Default: "Server=vuln-db;Database=Vuln_C7;User Id=c7_app;Password=${DB_APP_PASSWORD};TrustServerCertificate=true"
      FLAG_C7_PATHTRAVERSAL: ${FLAG_C7_PATHTRAVERSAL}
    tmpfs: ["/tmp", "/app/challenge-data"]   # C7 writes report + flag files at startup

  vuln-c4:                                   # Challenge 4 — FromSqlRaw interpolation
    <<: *vuln-api
    environment:
      CTF_CHALLENGE: c4
      ConnectionStrings__Default: "Server=vuln-db;Database=Vuln_C4;User Id=c4_app;Password=${DB_APP_PASSWORD};TrustServerCertificate=true"
      FLAG_C4_FROMSQLRAW: ${FLAG_C4_FROMSQLRAW}

  vuln-c5:                                   # Challenge 5 — mass assignment (login user1/hunter2)
    <<: *vuln-api
    environment:
      CTF_CHALLENGE: c5
      ConnectionStrings__Default: "Server=vuln-db;Database=Vuln_C5;User Id=c5_app;Password=${DB_APP_PASSWORD};TrustServerCertificate=true"
      FLAG_C5_MASSASSIGN: ${FLAG_C5_MASSASSIGN}

  vuln-c8:                                   # Challenge 8 — weak JWT signing key
    <<: *vuln-api
    environment:
      CTF_CHALLENGE: c8
      ConnectionStrings__Default: "Server=vuln-db;Database=Vuln_C8;User Id=c8_app;Password=${DB_APP_PASSWORD};TrustServerCertificate=true"
      FLAG_C8_WEAKJWT: ${FLAG_C8_WEAKJWT}
      JWT_WEAK_KEY: ${JWT_WEAK_KEY}

  vuln-c9:                                   # Challenge 9 — JWT validation switched off
    <<: *vuln-api
    environment:
      CTF_CHALLENGE: c9
      ConnectionStrings__Default: "Server=vuln-db;Database=Vuln_C9;User Id=c9_app;Password=${DB_APP_PASSWORD};TrustServerCertificate=true"
      FLAG_C9_JWTOFF: ${FLAG_C9_JWTOFF}
      JWT_STRONG_KEY: ${JWT_STRONG_KEY}

  vuln-c10:                                  # Challenge 10 — blind SQL injection
    <<: *vuln-api
    environment:
      CTF_CHALLENGE: c10
      ConnectionStrings__Default: "Server=vuln-db;Database=Vuln_C10;User Id=c10_app;Password=${DB_APP_PASSWORD};TrustServerCertificate=true"
      FLAG_C10_BLINDSQLI: ${FLAG_C10_BLINDSQLI}

  vuln-c11:                                  # Challenge 11 — race condition (self-contained SQLite)
    # Self-contained on SQLite so it can ALSO run as an ephemeral per-player container via the
    # CTFd docker-challenge plugin (see ctfd/plugins/README.md). This shared instance is the
    # demo / small-group fallback; restart it (fresh /tmp DB) or --reseed to reset.
    <<: *vuln-api
    depends_on: {}                           # SQLite: needs neither vuln-db nor db-init
    environment:
      CTF_CHALLENGE: c11
      DB_PROVIDER: sqlite
      SQLITE_PATH: /tmp/c11.db
      FLAG_C11_RACE: ${FLAG_C11_RACE}

  vuln-c12:                                  # Challenge 12 — API key in JS bundle (dashboard at /dashboard/)
    <<: *vuln-api
    environment:
      CTF_CHALLENGE: c12
      ConnectionStrings__Default: "Server=vuln-db;Database=Vuln_C12;User Id=c12_app;Password=${DB_APP_PASSWORD};TrustServerCertificate=true"
      FLAG_C12_BUNDLEKEY: ${FLAG_C12_BUNDLEKEY}
      C12_ADMIN_KEY: ${C12_ADMIN_KEY}
    tmpfs: ["/tmp", "/app/wwwroot/dashboard"]   # dashboard app.js is written at startup

  vuln-c6:                                   # Challenge 6 — stored XSS (React board at /board/)
    build:
      context: ./challenges                  # needs both vulnerable-web and vulnerable-api
      dockerfile: Dockerfile.c6
    image: ctf/vuln-c6:latest
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      CTF_CHALLENGE: c6
      ConnectionStrings__Default: "Server=vuln-db;Database=Vuln_C6;User Id=c6_app;Password=${DB_APP_PASSWORD};TrustServerCertificate=true"
      FLAG_C6_XSS: ${FLAG_C6_XSS}
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 512M }
    networks: [ctf-internal]
    depends_on:
      vuln-db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  c6-admin-bot:                              # reviews the board so XSS payloads fire
    build:
      context: ./challenges/vulnerable-web/admin-bot
    image: ctf/c6-admin-bot:latest
    environment:
      C6_BASE: http://vuln-c6:8080
      C6_INTERVAL_MS: "15000"
    networks: [ctf-internal]
    depends_on: [vuln-c6]
    restart: unless-stopped

  # ---------- Reverse proxy: exposes the internal-only challenges to players ----------
  # Challenges sit on ctf-internal (no internet egress). Caddy bridges edge<->internal and
  # publishes a port per challenge, so players on the internal LAN reach them by host:port
  # while the challenge containers themselves still cannot phone home.
  proxy:
    image: caddy:2
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "5001:5001"   # Challenge 1 — SQL injection
      - "5002:5002"   # Challenge 2 — IDOR
      - "5003:5003"   # Challenge 7 — path traversal
      - "5004:5004"   # Challenge 4 — FromSqlRaw
      - "5005:5005"   # Challenge 5 — mass assignment
      - "5006:5006"   # Challenge 6 — stored XSS
      - "5008:5008"   # Challenge 8 — weak JWT key
      - "5009:5009"   # Challenge 9 — JWT validation off
      - "5010:5010"   # Challenge 10 — blind SQL injection
      - "5011:5011"   # Challenge 11 — race condition
      - "5012:5012"   # Challenge 12 — API key in JS bundle
      - "5099:5099"   # Review service (submit solves / patches)
    networks: [ctf-internal, ctf-edge]
    depends_on: [vuln-c1, vuln-c2, vuln-c4, vuln-c5, vuln-c6, vuln-c7, vuln-c8, vuln-c9, vuln-c10, vuln-c11, vuln-c12, review]
    restart: unless-stopped

  # ---------- Challenge 3 — one-shot: seed the git-secret repo into a shared volume ----------
  c3-git-secret-seed:
    image: alpine/git:latest
    entrypoint: ["/bin/sh", "-c"]
    command: ["apk add --no-cache bash >/dev/null 2>&1; FLAG_C3_GITSECRET=\"$$FLAG_C3_GITSECRET\" bash /seed/seed-history.sh /out/billing-service && echo seeded"]
    environment:
      FLAG_C3_GITSECRET: ${FLAG_C3_GITSECRET}
    volumes:
      - ./challenges/git-secret/seed-history.sh:/seed/seed-history.sh:ro
      - c3-repo:/out
    networks: [ctf-internal]
    restart: "no"
    # After this runs, the seeded repo is in the c3-repo volume; the player host serves it
    # read-only to players (see docs/operator/DEPLOY.md). No long-running service needed.

  # ---------- Warm-up W1 — port recon (raw TCP banners; published for nmap) ----------
  warmup-w1:
    image: python:3.12-alpine
    command: ["python", "/app/listener.py"]
    environment:
      FLAG_W1_PORTRECON: ${FLAG_W1_PORTRECON}
    volumes:
      - ./challenges/warmups/W1-port-recon/listener.py:/app/listener.py:ro
    ports: ["47001:47001", "47002:47002", "48219:48219", "49500:49500"]
    networks: [ctf-edge]
    restart: unless-stopped
  # W2/W3/W4 are static artifacts: build with each build.py and hand the files to players on
  # the player host (see docs/operator/DEPLOY.md). No service needed.

  # ---------- Patch / explain-your-solve review service ----------
  review:
    build: ./review
    image: ctf/review:latest
    environment:
      REVIEW_QUEUE: /data/queue.jsonl
    volumes:
      - review-data:/data
    networks: [ctf-internal]
    restart: unless-stopped
    # Reviewer reads the queue with: docker compose exec review python3 review.py list|show|grade

  # ---------- Browser gateway to the player host ----------
  guacd:
    image: guacamole/guacd:1.5.5
    networks: [ctf-internal]
    restart: unless-stopped

  guacamole:
    image: guacamole/guacamole:1.5.5
    environment:
      GUACD_HOSTNAME: guacd
      MYSQL_HOSTNAME: guac-db
      MYSQL_DATABASE: guacamole
      MYSQL_USER: guacamole
      MYSQL_PASSWORD: ${GUAC_DB_PASSWORD}
    ports: ["8080:8080"]
    networks: [ctf-internal, ctf-edge]
    depends_on: [guacd, guac-db]
    restart: unless-stopped

  guac-db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: guacamole
      MARIADB_USER: guacamole
      MARIADB_PASSWORD: ${GUAC_DB_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes: ["guac-db-data:/var/lib/mysql"]
    networks: [ctf-internal]
    restart: unless-stopped

networks:
  ctf-internal:
    internal: true      # NO route to the internet for anything on this network
  ctf-edge:
    driver: bridge

volumes:
  ctfd-db-data:
  guac-db-data:
  c3-repo:
  review-data:
